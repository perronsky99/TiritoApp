<mat-sidenav-container class="sidenav-container">
  <!-- Sidenav (Mobile) -->
  <mat-sidenav
    #sidenav
    mode="over"
    [opened]="isSidenavOpen"
    (closed)="closeSidenav()">

    <div class="sidenav-header">
      <ng-container *ngIf="(currentUser$ | async) as user; else guestHeader">
        <div class="sidenav-user" (click)="goToProfile()">
          <img *ngIf="user?.avatar" [src]="user.avatar" class="sidenav-avatar" alt="avatar" />
          <div class="sidenav-user-info">
            <div class="sidenav-user-name">{{ user?.username || user?.name || 'Usuario' }}</div>
            <div class="sidenav-user-sub">Mi perfil ›</div>
          </div>
        </div>
      </ng-container>
      <ng-template #guestHeader>
        <span class="logo" (click)="goToHome()">Tirito</span>
      </ng-template>
    </div>

    <mat-nav-list>
      <a mat-list-item (click)="goToHome()">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Inicio</span>
      </a>

      <a mat-list-item (click)="goToTiritos()">
        <mat-icon matListItemIcon>list</mat-icon>
        <span matListItemTitle>Ver tiritos</span>
      </a>

      <a mat-list-item (click)="goToCreateTirito()">
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>Publicar tirito</span>
      </a>

      <ng-container *ngIf="authService.isLoggedIn">
        <mat-divider></mat-divider>

        <a mat-list-item (click)="goToRequests()">
          <mat-icon matListItemIcon>assignment</mat-icon>
          <span matListItemTitle>Solicitudes</span>
        </a>

        <a mat-list-item (click)="openFavorites()">
          <mat-icon matListItemIcon>favorite</mat-icon>
          <span matListItemTitle>Favoritos</span>
        </a>
        
        <a mat-list-item (click)="goToChat()">
          <mat-icon matListItemIcon [matBadge]="(unreadCount$ | async) || null" matBadgeColor="accent">chat</mat-icon>
          <span matListItemTitle>Mis chats</span>
        </a>
        
        <a mat-list-item (click)="goToProfile()">
          <mat-icon matListItemIcon>person</mat-icon>
          <span matListItemTitle>Mi perfil</span>
        </a>
        
        <mat-divider></mat-divider>
        
        <a mat-list-item (click)="logout()">
          <mat-icon matListItemIcon>logout</mat-icon>
          <span matListItemTitle>Cerrar sesión</span>
        </a>
      </ng-container>

      <ng-container *ngIf="!authService.isLoggedIn">
        <mat-divider></mat-divider>
        
        <a mat-list-item (click)="goToLogin()">
          <mat-icon matListItemIcon>login</mat-icon>
          <span matListItemTitle>Iniciar sesión</span>
        </a>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>
  <!-- Main Content -->
  
  <!-- Favoritos drawer (right) -->
    <mat-sidenav #favoritesSidenav position="end" mode="over" class="favorites-sidenav" (opened)="onFavoritesOpened()">
      <app-favorites-drawer #favoritesDrawer (close)="favoritesSidenav.close()"></app-favorites-drawer>
    </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content>
    <!-- Toolbar -->
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="toggleSidenav()" class="menu-btn">
        <mat-icon>menu</mat-icon>
      </button>
      
      <span class="logo" (click)="goToHome()">Tirito</span>

      <!-- Search bar -->
      <div class="header-search" style="max-width:420px; width:40%; margin-left:16px;">
        <app-search-bar></app-search-bar>
      </div>

      <span class="spacer"></span>

      <!-- Desktop nav -->
      <nav class="desktop-nav">
        <a mat-button (click)="goToTiritos()">Tiritos</a>
        <button 
          mat-raised-button 
          color="accent"
          (click)="goToCreateTirito()">
          <mat-icon>add</mat-icon>
          Publicar
        </button>
      </nav>

      <!-- User menu -->
      <ng-container *ngIf="authService.isLoggedIn; else loginBtn">
        <div class="desktop-only">
          <!-- Notification Dropdown (desktop only) -->
          <app-notification-dropdown></app-notification-dropdown>

          <ng-container *ngIf="(currentUser$ | async) as user">
            <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
              <img *ngIf="user?.avatar" [src]="user.avatar" class="user-avatar" alt="avatar"/>
              <mat-icon *ngIf="!user?.avatar">account_circle</mat-icon>
              <span class="user-name">{{ user?.username || user?.name || 'Usuario' }}</span>
            </button>
          </ng-container>

          <mat-menu #userMenu="matMenu">
            <button mat-menu-item disabled class="user-menu-header">
              <img *ngIf="(currentUser$ | async)?.avatar" [src]="(currentUser$ | async).avatar" class="user-avatar" alt="avatar" />
              <div class="user-info">
                <div class="user-name">{{ (currentUser$ | async)?.username || (currentUser$ | async)?.name || 'Usuario' }}</div>
                <div class="user-email" *ngIf="(currentUser$ | async)?.email">{{ (currentUser$ | async).email }}</div>
              </div>
            </button>

            <mat-divider></mat-divider>

            <button mat-menu-item (click)="openFavorites()">
              <mat-icon>favorite</mat-icon>
              <span>Favoritos</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="goToRequests()">
              <mat-icon>assignment</mat-icon>
              <span>Solicitudes</span>
            </button>
            <button mat-menu-item (click)="goToChat()">
              <mat-icon>chat</mat-icon>
              <span>Mis chats</span>
            </button>
            <button mat-menu-item (click)="goToProfile()">
              <mat-icon>person</mat-icon>
              <span>Mi perfil</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Cerrar sesión</span>
            </button>
          </mat-menu>
        </div>
      </ng-container>
      
      <ng-template #loginBtn>
        <button 
          mat-button 
          (click)="goToLogin()"
          class="login-btn">
          Ingresar
        </button>
      </ng-template>
    </mat-toolbar>

    <!-- Page content -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
