<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="logo">Tirito</h1>
      <p class="tagline">Trabajos puntuales, sin vueltas</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <h2>Restablecer contraseña</h2>
      <p>Ingresá tu nueva contraseña.</p>

      <mat-form-field appearance="outline">
        <mat-label>Nueva contraseña</mat-label>
        <input matInput type="password" formControlName="password">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirmar contraseña</mat-label>
        <input matInput type="password" formControlName="confirmPassword">
        <mat-error *ngIf="form?.hasError('mismatch')">Las contraseñas no coinciden</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="loading || form.invalid" class="submit-btn">
        {{ loading ? 'Restableciendo...' : 'Restablecer' }}
      </button>

      <p class="toggle-mode" style="margin-top:1rem; text-align:center;">
        <a routerLink="/auth/login">Volver a iniciar sesión</a>
      </p>
    </form>
  </div>
</div>
