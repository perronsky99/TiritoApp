<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="logo">Tirito</h1>
      <p class="tagline">Trabajos puntuales, sin vueltas</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <h2>Recuperar contraseña</h2>
      <p>Ingresá el email asociado a tu cuenta y te enviaremos instrucciones para restablecer la contraseña.</p>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="tu@email.com">
        <mat-error *ngIf="form.get('email')?.hasError('required')">El email es requerido</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Ingresá un email válido</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="loading || form.invalid" class="submit-btn">
        {{ loading ? 'Enviando...' : 'Enviar' }}
      </button>

      <p class="toggle-mode" style="margin-top:1rem; text-align:center;">
        <a routerLink="/auth/login">Volver a iniciar sesión</a>
      </p>
    </form>
  </div>
</div>
