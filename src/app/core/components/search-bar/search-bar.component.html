<div class="search-bar" [class.expanded]="isExpanded">
  <input #input type="text" [formControl]="control" placeholder="Buscar tiritos, ejemplo: 'plomería'" (keydown)="onKeydown($event)" (focus)="onFocus()" (blur)="onBlur()" aria-autocomplete="list" [attr.aria-expanded]="suggestions.length>0" aria-owns="suggestions-list" />
  <button mat-icon-button aria-label="Buscar" (click)="onSubmit()">
    <mat-icon>search</mat-icon>
  </button>

  <div class="suggestions" *ngIf="suggestions.length || loading" id="suggestions-list" role="listbox">
    <div *ngIf="loading" class="loading">Cargando...</div>
    <button
      class="suggestion"
      *ngFor="let s of suggestions; let i = index"
      (click)="onSelect(s)"
      (mousedown)="onSuggestionMouseDown()"
      (mouseup)="onSuggestionMouseUp()"
      [attr.id]="'search-sugg-' + i"
      [attr.role]="'option'"
      [attr.aria-selected]="activeIndex === i"
      [class.active]="activeIndex === i">
      <img *ngIf="s.images?.length" [src]="s.images[0].thumbnailUrl || s.images[0].url || s.images[0]" alt="" />
      <div class="meta">
        <div class="title" [innerHTML]="highlight(s.title)"></div>
        <div class="subtitle">{{ s.creatorName || '' }}</div>
      </div>
    </button>
    <div *ngIf="!loading && suggestions.length === 0" class="no-results">No se encontraron resultados. <button mat-button (click)="onSubmit()">Buscar de todos modos</button></div>
  </div>
</div>
